<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BitFiscal - {% block title %}{% endblock %}</title>
    <style>
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface2: #273449;
        --border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --accent2: #8b5cf6;
        --font-head: "Segoe UI", Tahoma, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .navbar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .navbar .brand {
        font-family: var(--font-head);
        font-weight: 800;
        font-size: 20px;
        color: #fff;
        text-decoration: none;
      }
      .navbar a.nav-link {
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
      }
      .navbar a.nav-link:hover { color: #fff; }
      .navbar .spacer { margin-left: auto; }
      .container { max-width: 1000px; margin: 0 auto; padding: 28px 24px; }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 22px;
        margin-bottom: 20px;
      }
      .card-title {
        font-family: var(--font-head);
        font-weight: 700;
        font-size: 16px;
        color: #fff;
        margin-bottom: 16px;
      }
      h2, h3, h4 { color: #fff; font-family: var(--font-head); margin-bottom: 12px; }
      label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      input, select, textarea {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 10px 12px;
        font-size: 14px;
        margin-bottom: 12px;
      }
      textarea { min-height: 80px; resize: vertical; }
      .form-row { display: flex; align-items: center; }
      .btn {
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
        display: inline-block;
      }
      .btn:hover { border-color: var(--accent); }
      .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      .btn-secondary { background: var(--accent2); color: #fff; border-color: var(--accent2); }
      .btn-sm { padding: 7px 12px; font-size: 13px; }
      table { width: 100%; border-collapse: collapse; }
      th, td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      th { color: var(--muted); font-weight: 600; }
      a { color: var(--accent); }
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: var(--surface2);
        color: var(--text);
      }
      .badge-aberto { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
      .badge-andamento { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
      .badge-pendente_aprovacao { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
      .badge-fechado { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a class="brand" href="/dashboard">BitFiscal</a>
      <a class="nav-link" href="/dashboard">Dashboard</a>
      <a class="nav-link" href="/monitor">Monitoramento</a>
      <a class="nav-link" href="/tickets">Chamados</a>
      <a class="nav-link" href="/backups">Backups</a>
      <a class="nav-link" href="/usage">Controle de Uso</a>
      <a class="nav-link" href="/reports">Relatórios</a>
      <a class="nav-link" href="/faq">FAQ</a>
      {% if user and user.role == 'admin' %}
      <a class="nav-link" href="/users">Usuários</a>
      {% endif %}
      <a class="nav-link spacer" href="/auth/logout">Sair</a>
    </nav>
    <div class="container">{% block content %}{% endblock %}</div>
  </body>
</html>
